spring:
  application:
    name: receiver
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off

server:
  port: 8081

receiver:
  clients: pix-core,ted-core,boleto-core,card-core
  rate-limit-per-second: ${RECEIVER_RATE_LIMIT_PER_SECOND:20000}
  kafka:
    bootstrap-servers: localhost:9092
    topic: transaction-commands.v1
    publish-timeout: 2500ms
  redis:
    host: localhost
    port: 6379
    command-timeout: 5ms
    pending-ttl: 5s
    done-ttl: 600s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      group:
        readiness:
          include: readinessState,kafkaProducer
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      service: receiver
